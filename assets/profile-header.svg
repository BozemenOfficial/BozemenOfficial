<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Bozemen — Web Developer · Full Stack</title>
<desc id="desc">Personal portfolio of Bozemen. Subtle animated blue lines behind the name.</desc>
<style>
.track { stroke-dasharray:110 680; animation:travel 12s linear infinite; }
.track.second { animation-delay:-6s; animation-duration:16s; }
.cursor { animation:pulse 3s ease-in-out infinite; }
@keyframes travel { to { stroke-dashoffset:-790; } }
@keyframes pulse { 0%,100% { opacity:.3; } 50% { opacity:1; } }
@media(prefers-reduced-motion:reduce) { .track,.cursor { animation:none; } }
</style>
